[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dentrx"
version = "0.1.0"
description = "An open, guideline-cited dental prescribing reference (antibiotics & analgesics). Educational reference, not a prescription."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hossein Boustani Hezarani" }]
keywords = ["dentistry", "prescribing", "antibiotic stewardship", "analgesia", "clinical decision support", "evidence-based dentistry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Hezarani/dentrx"
Repository = "https://github.com/Hezarani/dentrx"
Documentation = "https://hezarani.github.io/dentrx/"

[project.scripts]
dentrx = "dentrx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[tool.setuptools]
packages = ["dentrx"]

[tool.setuptools.package-data]
dentrx = ["data/*.json"]
